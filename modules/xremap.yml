# xremap: the keyboard policy that used to live in keyd + XKB options.
#
# Layering (important): xremap sits BELOW XKB, on raw evdev keycodes.
# It never sees layout/option remaps, and everything it emits is then
# re-mapped by XKB. That is why the whole caps/ctrl/cmd cycle lives here
# (one layer, coherent for both apps AND xremap's own combo matching) and
# nothing is added to the xkb layouts. modmap rewrites each *input* keycode
# once (first matching rule wins) and never re-looks-up its own output, so
# CapsLock->Control_L is NOT chained through the Control_L->Super_L rule.
#
# Chain: hardware -> keyd (virtual device "keyd", vendor 0x0fac-ignored
# output) -> xremap (grabs ONLY the keyd device) -> KWin/XKB. keyd exists
# solely for the Cmd+Tab/grave Alt-HOLD hold-layer (swapm) that xremap
# cannot express: the KWin switcher popups need a modifier physically held
# across repeated presses. Those combos are fully consumed by keyd and
# arrive here as plain Alt-events — never add F13-tab/F13-grave rules.
#
# Consequences to know:
# - SDDM greeter: xremap is a user service (KDE client cannot run as root),
#   so it is not running before login. Login screen keys are raw/vanilla
#   except keyd's switcher hold-layer (keyd is a system service).

# The physical Cmd key becomes F13: a non-modifier key declared as a virtual
# modifier. It is inert in every app (nothing binds F13), and keymap rules
# below match "F13-<key>" as the new Cmd. Left/right super keys both feed it;
# the Super role is the physical Ctrl key's job now (Control_L->Super_L).
# (xremap has no Meta_* aliases: KEY_LEFTMETA is Super_L/WIN_L there.)
virtual_modifiers:
  - F13

modmap:
  - name: emacs
    application:
      # class arrives as 'Emacs' (capital E, see journalctl "active window")
      # and xremap regexes are case-sensitive -> (?i)
      only: [/(?i)emacs/]
    remap:
      CapsLock: Control_L
      Control_L: Super_L
      Control_R: Super_L
      Super_L: Control_R # Map to right ctrl
      Super_R: Super_R # right cmd stays true Super here, per spec

  - name: base cycle (caps->ctrl, ctrl->super, cmd->F13)
    remap:
      CapsLock: Control_L
      Control_L: Super_L
      Control_R: Super_R
      Super_L: F13
      Super_R: F13

keymap:
  # Application-specific blocks MUST come before the generic block:
  # xremap uses the first matching keymap entry.

  - name: terminals (emulators only; tmux/vim inside inherit this)
    application:
      only: [/konsole/, /ghostty/, /seance/]
    remap:
      # KEPT — terminal FEATURES only (emulator Ctrl+Shift+* dialect);
      # all text-editing shortcuts belong to the caps-key Ctrl, not Cmd:
      F13-c: Ctrl-Shift-c # copy
      F13-v: Ctrl-Shift-v # paste
      F13-x: Ctrl-Shift-x # cut
      F13-f: Ctrl-Shift-f # find
      F13-t: Ctrl-Shift-t # new tab
      F13-w: Ctrl-Shift-w # close tab
      F13-n: Ctrl-Shift-n # new window (konsole/ghostty)
      # next/prev tab
      F13-backspace: Ctrl-Delete # kill word forward (Mac Cmd+Delete)
      F13-left: Ctrl-Shift-Tab # word left
      F13-right: Ctrl-Tab # word right
      # next/prev workspace
      F13-up: Ctrl-PageUp
      F13-down: Ctrl-PageDown
      # SWALLOWED — plain duplicates of the caps-key Ctrl (the readline ops
      # live there on purpose; Cmd+K/Cmd+R on Mac do NOT mean kill/reverse
      # search, so no emulation to preserve) or outright dangerous:
      # C-s = XOFF tty freeze, C-d = EOF/logout, C-z = SIGTSTP.
      # Special note: C-i IS Tab and C-j IS a newline — never let an
      # unmapped Ctrl+letter leak into a terminal.
      F13-a: []
      F13-b: []
      F13-e: []
      F13-g: []
      F13-i: []
      F13-j: []
      F13-k: []
      F13-l: []
      F13-o: []
      F13-p: []
      F13-r: []
      F13-s: []
      F13-u: []
      F13-y: []
      F13-d: []
      F13-z: []
      F13-slash: []
      F13-enter: []
      # q (Alt-F4), space (run dialog), 1/2 (layout switch) are NOT
      # overridden here on purpose: they fall through to the generic
      # block and do the same thing they do everywhere else.

  - name: default everywhere else (GUI apps)
    remap:
      F13-x: Ctrl-x
      F13-c: Ctrl-c
      F13-v: Ctrl-v
      F13-a: Ctrl-a
      F13-o: Ctrl-o
      F13-p: Ctrl-p
      F13-z: Ctrl-z
      F13-t: Ctrl-t
      F13-w: Ctrl-w
      F13-f: Ctrl-f # find
      F13-g: Ctrl-g # find next (Cmd+Shift+G = previous, via shifted match)
      F13-b: Ctrl-b # bold / Firefox bookmark sidebar
      F13-d: Ctrl-d # bookmark
      F13-e: Ctrl-e # Chrome address/search pick; readline end-of-line in shells
      F13-i: Ctrl-i # page info / italic
      F13-j: Ctrl-j # downloads
      F13-k: Ctrl-k # search bar (Firefox); readline kill-forward in shells
      F13-l: Ctrl-l # URL bar; readline end-of-line; Ctrl+L clears shells
      F13-n: Ctrl-n # new window/message
      F13-r: Ctrl-r # reload; Ctrl+R reverse history search in shells
      F13-s: Ctrl-s # save (swallowed in terminals, see above)
      F13-u: Ctrl-u # view source; readline kill-backward in shells
      F13-y: Ctrl-y # redo; readline yank in shells
      F13-slash: Ctrl-slash # comment toggle in editors
      F13-enter: Ctrl-Enter # send message / run cell
      F13-backspace: Ctrl-Delete # Mac Cmd+Delete = forward delete
      F13-left: Ctrl-left # word left
      F13-right: Ctrl-right # word right
      # no Home/End keys on this board; Mac Cmd+Up/Down = start/end of doc
      # (Ctrl+Home/End in Qt/GTK), so those combos drive the arrow keys.
      F13-up: Ctrl-home
      F13-down: Ctrl-end
      # Cmd+1/2 = KWin's Meta+Alt+1/2 layout-switch shortcuts (home.nix).
      # Other digits stay unmapped on purpose (0-9/equal/minus excluded).
      F13-1: Alt-Super-1
      F13-2: Alt-Super-2
      F13-q: Alt-F4 # quit -> KWin close
      F13-space: Alt-F2 # run app dialogue
      # Cmd+Tab / Cmd+grave intentionally NOT here: keyd emits real
      # Alt-hold + Tab/grave before xremap sees them (swapm hold-layer),
      # and the popup needs that physical hold. If a rule matched here,
      # xremap would stack a second synthetic Alt on top of keyd's held
      # Alt_L (inexact matching lets combos through with extra modifiers) —
      # leave them unclaimed.
