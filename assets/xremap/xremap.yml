# xremap: the keyboard policy that used to live in keyd + XKB options.
#
# Layering (important): xremap sits BELOW XKB, on raw evdev keycodes.
# It never sees layout/option remaps, and everything it emits is then
# re-mapped by XKB. That is why the whole caps/ctrl/cmd cycle lives here
# (one layer, coherent for both apps AND xremap's own combo matching) and
# nothing is added to the xkb layouts. modmap rewrites each *input* keycode
# once (first matching rule wins) and never re-looks-up its own output, so
# CapsLock->Control_L is NOT chained through the Control_L->Super_L rule.
#
# Chain: hardware -> keyd (virtual device "keyd", vendor 0x0fac-ignored
# output) -> xremap (grabs ONLY the keyd device) -> KWin/XKB. keyd exists
# solely for the Cmd+Tab/grave Alt-HOLD hold-layer (swapm) that xremap
# cannot express: the KWin switcher popups need a modifier physically held
# across repeated presses. Those combos are fully consumed by keyd and
# arrive here as plain Alt-events — never add F13-tab/F13-grave rules.
#
# Consequences to know:
# - SDDM greeter: xremap is a user service (KDE client cannot run as root),
#   so it is not running before login. Login screen keys are raw/vanilla
#   except keyd's switcher hold-layer (keyd is a system service).

# The physical Cmd key becomes F13: a non-modifier key declared as a virtual
# modifier. It is inert in every app (nothing binds F13), and keymap rules
# below match "F13-<key>" as the new Cmd. Left/right super keys both feed it;
# the Super role is the physical Ctrl key's job now (Control_L->Super_L).
# (xremap has no Meta_* aliases: KEY_LEFTMETA is Super_L/WIN_L there.)
virtual_modifiers:
  - F13

modmap:
  - name: emacs (left cmd = Super, right cmd = Hyper)
    application:
      # class arrives as 'Emacs' (capital E, see journalctl "active window")
      # and xremap regexes are case-sensitive -> (?i)
      only: [/(?i)emacs/]
    remap:
      CapsLock: Control_L
      Control_L: Super_L
      Control_R: Super_L
      # F14 prefix scheme: left cmd -> F13, every F13+key becomes
      # [F14, key] in the emacs keymap block below.
      # Old rollback identity: Super_L: Super_L (real Super, the s- space)
      Super_L: F13
      # Right cmd = Hyper: keyd normalizes both cmd keys to KEY_LEFTMETA
      # (mac-keys.nix), so right cmd arrives here as KEY_MENU ("Menu",
      # the only distinguishable output). Menu -> CapsLock (keycode 58,
      # nothing else ever emits it: the physical caps key is consumed by
      # the cycle above) -> the caps:hyper XKB option (desktop.nix)
      # rewrites that keycode to Hyper_L and hyper(mod3) puts Hyper_L in
      # Mod3's keysym set -> X11 depresses Mod3 for ANY Hyper_L press ->
      # Emacs (XWayland) reads real H-. No caps-lock side effect: the
      # option replaces the key outright. KDE wart: a bare tap shows the
      # Hyper keysym to Qt as a broken Meta -> Plasma search launcher.
      # Super_R lines kept defensively (unreachable while keyd fronts
      # the chain, harmless if that ever changes).
      Menu: CapsLock
      Super_R: CapsLock

  - name: base cycle (caps->ctrl, ctrl->super, cmd->F13)
    remap:
      CapsLock: Control_L
      Control_L: Super_L
      Control_R: Super_R
      Super_L: F13
      Super_R: F13
      # right cmd arrives as Menu (keyd normalization, see mac-keys.nix):
      # make it F13 here so it behaves exactly like cmd everywhere else.
      Menu: F13

keymap:
  # Application-specific blocks MUST come before the generic block:
  # xremap uses the first matching keymap entry.

  # macOS-style screenshots. Cmd is F13 here, so the triggers are
  # F13-Shift-<digit>. This block is FIRST and has no app filter: xremap
  # checks entries in order per combo, so these win in every app (including
  # Emacs and terminals) while every other combo falls through.
  #   Cmd+Shift+1 = current (active) window, save + copy image
  #   Cmd+Shift+2 = window under cursor, save + copy image
  #   Cmd+Shift+3 = full screen, save + copy image
  #   Cmd+Shift+4 = rectangular region, save + copy image
  #   Cmd+Shift+5 = Spectacle GUI (delay/options/recording)
  #   Cmd+Shift+6 = unbound (swallowed; the old window-under-cursor key)
  # The script does the timestamped file + clipboard; background mode
  # ignores Spectacle's GUI save/clipboard settings. Needs
  # --allow-launch true (xremap.nix).
  #
  # The script is passed as an ARGUMENT to the absolute bash — never as
  # `bash -c /path/script`. The xremap unit's PATH has no bash, so a
  # `#!/usr/bin/env bash` shebang would be resolved against it and fail
  # ("env: 'bash': No such file or directory", exit 127) with the child's
  # stderr discarded. `bash /path/script` runs the file directly and
  # ignores the shebang.
  - name: screenshots (macOS Cmd+Shift+1/2/3/4/5)
    remap:
      F13-Shift-1: { launch: ["/run/current-system/sw/bin/bash", "@SCREENSHOT@", "current"] }
      F13-Shift-2: { launch: ["/run/current-system/sw/bin/bash", "@SCREENSHOT@", "window"] }
      F13-Shift-3: { launch: ["/run/current-system/sw/bin/bash", "@SCREENSHOT@", "full"] }
      F13-Shift-4: { launch: ["/run/current-system/sw/bin/bash", "@SCREENSHOT@", "region"] }
      F13-Shift-5: { launch: ["/run/current-system/sw/bin/bash", "@SCREENSHOT@", "gui"] }
      F13-Shift-6: []

  - name: emacs (F14 prefix scheme)
    application:
      only: [/(?i)emacs/]
    remap:
      # F13+<key> -> the key sequence [F14, <key>]. F14 reaches Emacs as
      # <XF86Launch5> (measured 2026-11-09); the elisp binding in ~/.emacs.d
      # (prelude fork, "Bind Cmd as a Super prefix") maps it to
      # event-apply-super-modifier, so the following key arrives as s-<key>.
      # tab/grave NOT listed:
      # keyd consumes them upstream. Arrows/home/end and space DELIBERATELY
      # absent (fall through to the generic block: Cmd+space keeps doing
      # the Alt+F2 run dialog — better than any chord).
      F13-a: [F14, a]
      F13-b: [F14, b]
      F13-c: [F14, c]
      F13-d: [F14, d]
      F13-e: [F14, e]
      F13-f: [F14, f]
      F13-g: [F14, g]
      F13-h: [F14, h]
      F13-i: [F14, i]
      F13-j: [F14, j]
      F13-k: [F14, k]
      F13-l: [F14, l]
      F13-m: [F14, m]
      F13-n: [F14, n]
      F13-o: [F14, o]
      F13-p: [F14, p]
      F13-q: [F14, q]
      F13-r: [F14, r]
      F13-s: [F14, s]
      F13-t: [F14, t]
      F13-u: [F14, u]
      F13-v: [F14, v]
      F13-w: [F14, w]
      F13-x: [F14, x]
      F13-y: [F14, y]
      F13-z: [F14, z]
      F13-0: [F14, "0"]
      F13-1: [F14, "1"]
      F13-2: [F14, "2"]
      F13-3: [F14, "3"]
      F13-4: [F14, "4"]
      F13-5: [F14, "5"]
      F13-6: [F14, "6"]
      F13-7: [F14, "7"]
      F13-8: [F14, "8"]
      F13-9: [F14, "9"]
      F13-F1: [F14, F1]
      F13-F2: [F14, F2]
      F13-F3: [F14, F3]
      F13-F4: [F14, F4]
      F13-F5: [F14, F5]
      F13-F6: [F14, F6]
      F13-F7: [F14, F7]
      F13-F8: [F14, F8]
      F13-F9: [F14, F9]
      F13-F10: [F14, F10]
      F13-F11: [F14, F11]
      F13-F12: [F14, F12]
      F13-minus: [F14, minus]
      F13-equal: [F14, equal]
      F13-leftbrace: [F14, leftbrace]
      F13-rightbrace: [F14, rightbrace]
      F13-apostrophe: [F14, apostrophe]
      F13-backslash: [F14, backslash]
      F13-semicolon: [F14, semicolon]
      F13-comma: [F14, comma]
      F13-dot: [F14, dot]
      F13-slash: [F14, slash]
      F13-enter: [F14, enter]
      F13-backspace: [F14, backspace]
      F13-delete: [F14, delete]
      F13-esc: [F14, esc]

  - name: terminals (emulators only; tmux/vim inside inherit this)
    application:
      only: [/konsole/, /ghostty/, /seance/]
    remap:
      # KEPT — terminal FEATURES only (emulator Ctrl+Shift+* dialect);
      # all text-editing shortcuts belong to the caps-key Ctrl, not Cmd:
      F13-c: Ctrl-Shift-c # copy
      F13-v: Ctrl-Shift-v # paste
      F13-f: Ctrl-Shift-f # find
      F13-t: Ctrl-Shift-t # new tab
      F13-w: Ctrl-Shift-w # close tab
      F13-Alt-w: Ctrl-Shift-Alt-w # close tap kill zmx
      F13-Alt-q: Ctrl-Shift-Alt-q # close all kill zmx
      F13-n: Ctrl-Shift-n # new window (konsole/ghostty)
      F13-z: Ctrl-Shift-z # seance-zmx tab restore
      F13-k: Ctrl-Alt-Shift-k # seance-zmx kill zmx unattached
      F13-l: Ctrl-Shift-k # seance cLear
      F13-backspace: Ctrl-Delete # kill word forward (Mac Cmd+Delete)
      # next/prev tab
      F13-left: Ctrl-Shift-left # split tab left
      F13-right: Ctrl-Shift-right # split tab right
      # next/prev workspace
      F13-up: Ctrl-PageUp
      F13-down: Ctrl-PageDown
      # SWALLOWED — plain duplicates of the caps-key Ctrl (the readline ops
      # live there on purpose; Cmd+K/Cmd+R on Mac do NOT mean kill/reverse
      # search, so no emulation to preserve) or outright dangerous:
      # C-s = XOFF tty freeze, C-d = EOF/logout, C-z = SIGTSTP.
      # Special note: C-i IS Tab and C-j IS a newline — never let an
      # unmapped Ctrl+letter leak into a terminal.
      F13-a: []
      F13-b: []
      F13-e: []
      F13-g: []
      F13-i: []
      F13-j: []
      F13-o: []
      F13-p: []
      F13-r: []
      F13-s: []
      F13-u: []
      F13-y: []
      F13-d: []
      F13-slash: []
      F13-enter: []
      # q (Alt-F4), space (run dialog), 1/2 (layout switch) are NOT
      # overridden here on purpose: they fall through to the generic
      # block and do the same thing they do everywhere else.

  - name: default everywhere else (GUI apps)
    remap:
      F13-x: Ctrl-x
      F13-c: Ctrl-c
      F13-v: Ctrl-v
      F13-a: Ctrl-a
      F13-o: Ctrl-o
      F13-p: Ctrl-p
      F13-z: Ctrl-z
      F13-t: Ctrl-t
      F13-w: Ctrl-w
      F13-f: Ctrl-f # find
      F13-g: Ctrl-g # find next (Cmd+Shift+G = previous, via shifted match)
      F13-b: Ctrl-b # bold / Firefox bookmark sidebar
      F13-d: Ctrl-d # bookmark
      F13-e: Ctrl-e # Chrome address/search pick; readline end-of-line in shells
      F13-i: Ctrl-i # page info / italic
      F13-j: Ctrl-j # downloads
      F13-k: Ctrl-k # search bar (Firefox); readline kill-forward in shells
      F13-l: Ctrl-l # URL bar; readline end-of-line; Ctrl+L clears shells
      F13-n: Ctrl-n # new window/message
      F13-r: Ctrl-r # reload; Ctrl+R reverse history search in shells
      F13-s: Ctrl-s # save (swallowed in terminals, see above)
      F13-u: Ctrl-u # view source; readline kill-backward in shells
      F13-y: Ctrl-y # redo; readline yank in shells
      F13-slash: Ctrl-slash # comment toggle in editors
      F13-enter: Ctrl-Enter # send message / run cell
      F13-backspace: Ctrl-Delete # Mac Cmd+Delete = forward delete
      F13-left: Ctrl-left # word left
      F13-right: Ctrl-right # word right
      # no Home/End keys on this board; Mac Cmd+Up/Down = start/end of doc
      # (Ctrl+Home/End in Qt/GTK), so those combos drive the arrow keys.
      F13-up: Ctrl-home
      F13-down: Ctrl-end
      # Cmd+1/2 = KWin's Meta+Alt+1/2 layout-switch shortcuts (home.nix).
      # Other digits stay unmapped on purpose (0-9/equal/minus excluded).
      F13-1: Alt-1
      F13-2: Alt-2
      F13-3: Alt-3
      F13-4: Alt-4
      F13-5: Alt-5
      F13-6: Alt-6
      F13-7: Alt-7
      F13-8: Alt-8
      F13-9: Alt-9
      F13-F1: Alt-Super-1
      F13-F2: Alt-Super-2
      F13-q: Alt-F4 # quit -> KWin close
      F13-space: Alt-F2 # run app dialogue
      # Cmd+Tab / Cmd+grave intentionally NOT here: keyd emits real
      # Alt-hold + Tab/grave before xremap sees them (swapm hold-layer),
      # and the popup needs that physical hold. If a rule matched here,
      # xremap would stack a second synthetic Alt on top of keyd's held
      # Alt_L (inexact matching lets combos through with extra modifiers) —
      # leave them unclaimed.
